<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Comic - ComicCraft</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">

</head>

<body>

<div class="container">

    <header>

        <h1>📖 Your Comic</h1>

        <p>
            {{ character }}'s Adventure
        </p>

    </header>


    <div class="summary">

        <h2>Comic Details</h2>

        <p>
            <strong>Story:</strong>
            {{ prompt }}
        </p>

        <p>
            <strong>Character:</strong>
            {{ character }}
        </p>

        <p>
            <strong>Setting:</strong>
            {{ setting }}
        </p>

        <p>
            <strong>Tone:</strong>
            {{ tone }}
        </p>

        <p>
            <strong>Art Style:</strong>
            {{ art_style }}
        </p>

    </div>


    {% for panel in panels %}

    <div class="panel">

        <h2>
            {{ panel.title }}
        </h2>

        <img
            src="{{ panel.image }}"
            alt="{{ panel.title }}"
        >

        <p>
            {{ panel.text }}
        </p>

    </div>

    {% endfor %}


    <a href="/" class="back-button">
        ← Create Another Comic
    </a>

</div>

</body>
</html>
